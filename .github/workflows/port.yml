# Port como código (ADR 0017): plan en cada PR que toque port/ (comentado en el PR) y apply al
# fusionar en main. AWS por OIDC con el rol que solo puede asumir el entorno "port".
name: port

on:
  pull_request:
    paths: ["port/**", ".github/workflows/port.yml"]
  push:
    branches: [main]
    paths: ["port/**", ".github/workflows/port.yml"]

permissions: {}

concurrency:
  group: port-terraform # un solo plan/apply a la vez contra el mismo estado
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ github.event_name == 'push' && 'apply' || 'plan' }}
    # los PR desde forks no reciben secretos ni token OIDC del entorno: no se intenta
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: port
    permissions:
      contents: read
      id-token: write # OIDC → rol IAM del estado
      pull-requests: write # comentar el plan
    defaults:
      run:
        working-directory: port
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      PORT_BETA_FEATURES_ENABLED: "true" # port_page (ficha del servicio) es beta en el proveedor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: validate
        run: terraform validate
      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Port · terraform plan"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comentar el plan en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "#### 🧭 Port · \`terraform plan\`"
            echo
            echo "**$(grep -E '^(Plan:|No changes)' plan.txt | head -1)**"
            echo
            echo "<details><summary>Plan completo</summary>"
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
            echo
            echo "[Ejecución]($RUN_URL) · se aplica al fusionar en \`main\`."
          } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - name: apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
